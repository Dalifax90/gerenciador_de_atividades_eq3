{% extends "base.html" %}

{% block content %}

<section class="card">
  <form action="{{ url_for('add') }}" method="post" class="add-form">
    <input name="title" required placeholder="What do you need to do?">
    <button type="submit">Add</button>
  </form>
</section>

<!-- Static demo version (NO Jinja) -->

    <section class="card">
    {% if tasks %}
      <ul class="tasks">
      {% for task in tasks %}
          <li class="task{% if task.done %} done{% endif %}">

            <button class="toggle" type="button">✓</button>

            <span class="title">{{ task.title }}</span>

            <form action="{{url_for('delete', task_id=task.id)}}" method="post">

              <button class="delete" title="Delete" type="submit">×</button>
           
            </form>

          </li>
     {% endfor %}
     </ul>

      {% else %}
        <p class="empty">Nenhuma tarefa ainda.</p>
      {% endif %}

    </section>

{% endblock %}
